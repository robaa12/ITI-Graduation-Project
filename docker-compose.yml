services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Queue backend. Append-only persistence is what lets enqueued generation
  # jobs survive a Redis restart instead of leaving their rows stuck PENDING.
  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Deliberately opt-in: do not start this profile or pull a model until the
  # host GPU/driver is healthy. Mastra running on the host reaches it through
  # http://localhost:11434; a containerized Mastra can use http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    profiles: ['local-rag']
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Applies the committed Prisma migrations once the database accepts
  # connections. Keeping this separate from the API image makes deployment
  # ordering explicit and lets `docker compose up migrate` initialise a fresh
  # database without starting the application.
  migrate:
    build:
      context: .
      target: migrator
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?schema=public
    depends_on:
      db:
        condition: service_healthy

  # Long-running Mastra workflow API. Its generated server exposes the
  # workflow endpoints and internal project-knowledge routes on the private
  # Compose network; port 4111 remains published for Studio/API diagnostics.
  mastra:
    build:
      context: ../marketing_demo
    restart: unless-stopped
    env_file:
      - ../marketing_demo/.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${MASTRA_PORT:-4111}:4111'
    environment:
      NODE_ENV: production
      PORT: 4111
      MASTRA_HOST: 0.0.0.0
      MASTRA_STORAGE_URL: file:/app/data/marketing.db
      MASTRA_OBSERVABILITY_PATH: /app/data/observability.duckdb
      MASTRA_INTERNAL_TOKEN: ${MASTRA_INTERNAL_TOKEN:-}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_POSTGRES_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
      RAG_POSTGRES_SCHEMA: ${RAG_POSTGRES_SCHEMA:-rag}
      OLLAMA_BASE_URL: ${MASTRA_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - mastra_data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4111/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?schema=public
      MASTRA_BASE_URL: http://mastra:4111
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MASTRA_TIMEOUT_MS: ${MASTRA_TIMEOUT_MS:-900000}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      MASTRA_INTERNAL_TOKEN: ${MASTRA_INTERNAL_TOKEN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mastra:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  mastra_data:
